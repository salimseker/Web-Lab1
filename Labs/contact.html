<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ByteForge Technologies - Contact</title>
</head>
<body>

<header>
  <h1>ByteForge Technologies</h1>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>
</header>

<main>

  <h2>Contact Us</h2>
  <p>
    Tell us a bit about your project and preferred meeting time, and one
    of our consultants will get back to you within one business day.
  </p>

  <form action="#" method="post">

    <fieldset>
      <legend>Your Information</legend>

      <p>
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname" required>
      </p>

      <p>
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" required>
      </p>

      <p>
        <label for="meetingdate">Preferred Meeting Date:</label>
        <input type="date" id="meetingdate" name="meetingdate">
      </p>
    </fieldset>

    <fieldset>
      <legend>Project Details</legend>

      <p>
        <label for="service">Service of Interest:</label>
        <select id="service" name="service">
          <option value="software-development">Custom Software Development</option>
          <option value="cloud-migration">Cloud Migration</option>
          <option value="it-consulting">IT Consulting</option>
          <option value="mobile-development">Mobile App Development</option>
          <option value="cybersecurity-audit">Cybersecurity Audit</option>
        </select>
      </p>

      <p>
        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="6" cols="40" placeholder="Briefly describe your project..."></textarea>
      </p>
    </fieldset>

    <p>
      <input type="submit" value="Send Message">
    </p>

  </form>

</main>

<footer>
  <p>&copy; 2026 Salim Seker. All rights reserved.</p>
</footer>

</body>
</html>
